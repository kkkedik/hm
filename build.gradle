plugins {
    id 'java'
    id('io.qameta.allure') version '4.1.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

allure {
    report {
        version.set("2.19.0")
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set("2.19.0")
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.4.1",
            'org.junit.jupiter:junit-jupiter:5.10.3',
            'org.slf4j:slf4j-log4j12:2.0.13',
            'io.qameta.allure:allure-selenide:2.29.1'
    )

    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.9.0')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())
    testLogging {
        lifecycle {
            events("started", "skipped", "failed", "standard_error", "standard_out")
            exceptionFormat("short")
        }
    }
}

task demoqa_test(type: Test){
    useJUnitPlatform{includeTags("demoqa")}
}